<section class="page">
  <div class="page-header">
    <h1>Tasks Board</h1>
    <button pButton type="button" label="New Task" icon="pi pi-plus" (click)="openNewTaskDialog()"></button>
  </div>

  <p-dialog
    header="Create New Task"
    [(visible)]="isNewTaskDialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '640px' }">
    <form class="task-form" (ngSubmit)="createTask()">
      <label for="title">Titulo</label>
      <input id="title" pInputText name="title" [(ngModel)]="form.title" required />

      <label for="description">Descripcion</label>
      <textarea id="description" pInputTextarea name="description" [(ngModel)]="form.description"></textarea>

      <label for="inputVariablesJson">Variables de entrada (JSON)</label>
      <textarea id="inputVariablesJson" pInputTextarea name="inputVariablesJson" [(ngModel)]="form.inputVariablesJson"></textarea>

      <label for="reproSteps">Pasos para reproducir</label>
      <textarea id="reproSteps" pInputTextarea name="reproSteps" [(ngModel)]="form.reproSteps"></textarea>

      <label for="expectedResult">Resultado esperado</label>
      <textarea id="expectedResult" pInputTextarea name="expectedResult" [(ngModel)]="form.expectedResult"></textarea>

      <div class="dialog-actions">
        <button pButton type="button" label="Cancelar" severity="secondary" (click)="isNewTaskDialogVisible = false"></button>
        <button pButton type="submit" label="Guardar Task"></button>
      </div>
    </form>
  </p-dialog>

  <div class="run-toolbar">
    <button pButton type="button" label="Iniciar corrida" (click)="startRunGroup()"></button>
    <button pButton type="button" label="Finalizar corrida" severity="secondary" (click)="finishRunGroup()"></button>
    <span>Run Group Activo: {{ (runGroupId$ | async) ?? 'ninguno' }}</span>
  </div>

  <section class="columns">
    <div class="column">
      <h2>En espera</h2>
      @for (task of (waitingTasks$ | async); track task.id) {
        <app-task-card
          [task]="task"
          (statusChange)="changeStatus($event)"
          (assignAgent)="assignAgent($event)"
          (recordOk)="recordOk($event)"
          (recordFail)="recordFail($event)">
        </app-task-card>
      }
    </div>

    <div class="column">
      <h2>Ejecutando</h2>
      @for (task of (executingTasks$ | async); track task.id) {
        <app-task-card
          [task]="task"
          (statusChange)="changeStatus($event)"
          (assignAgent)="assignAgent($event)"
          (recordOk)="recordOk($event)"
          (recordFail)="recordFail($event)">
        </app-task-card>
      }
    </div>

    <div class="column">
      <h2>Finalizado</h2>
      @for (task of (finishedTasks$ | async); track task.id) {
        <app-task-card
          [task]="task"
          (statusChange)="changeStatus($event)"
          (assignAgent)="assignAgent($event)"
          (recordOk)="recordOk($event)"
          (recordFail)="recordFail($event)">
        </app-task-card>
      }
    </div>
  </section>
</section>
