<section class="page">
  <p-confirmdialog></p-confirmdialog>
  <div class="page-header">
    <h1>Tasks Board</h1>
    <button pButton type="button" label="New Task" icon="pi pi-plus" (click)="openNewTaskDialog()"></button>
  </div>

  <p-dialog
    header="Create New Task"
    [(visible)]="isNewTaskDialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '640px' }">
    <form class="task-form" (ngSubmit)="createTask()">
      <label for="title">Titulo</label>
      <input id="title" pInputText name="title" [(ngModel)]="form.title" required />

      <label for="description">Descripcion</label>
      <textarea id="description" pInputTextarea name="description" [(ngModel)]="form.description"></textarea>

      <label for="inputVariablesJson">Variables de entrada (JSON)</label>
      <textarea id="inputVariablesJson" pInputTextarea name="inputVariablesJson" [(ngModel)]="form.inputVariablesJson"></textarea>

      <label for="reproSteps">Pasos para reproducir</label>
      <textarea id="reproSteps" pInputTextarea name="reproSteps" [(ngModel)]="form.reproSteps"></textarea>

      <label for="expectedResult">Resultado esperado</label>
      <textarea id="expectedResult" pInputTextarea name="expectedResult" [(ngModel)]="form.expectedResult"></textarea>

      <div class="dialog-actions">
        <button pButton type="button" label="Cancelar" severity="secondary" (click)="isNewTaskDialogVisible = false"></button>
        <button pButton type="submit" label="Guardar Task"></button>
      </div>
    </form>
  </p-dialog>

  <p-dialog
    header="Ejecutar Task"
    [(visible)]="isExecuteDialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '420px' }">
    <div class="task-form">
      <label for="executeAgentName">Nombre del agente</label>
      <p-autocomplete
        inputId="executeAgentName"
        [(ngModel)]="executeAgentInput"
        [suggestions]="executeAgentSuggestions"
        [dropdown]="true"
        [optionLabel]="'label'"
        [style]="{ width: '100%' }"
        [inputStyle]="{ width: '100%' }"
        (completeMethod)="filterAgentSuggestions($event.query)"
        (onSelect)="onExecuteAgentSelected($event.value)">
      </p-autocomplete>
      <div class="dialog-actions">
        <button pButton type="button" label="Cancelar" severity="secondary" (click)="isExecuteDialogVisible = false"></button>
        <button pButton type="button" label="Continuar" (click)="confirmExecuteTask()"></button>
      </div>
    </div>
  </p-dialog>

  <p-dialog
    header="Editar Task"
    [(visible)]="isEditTaskDialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '640px' }">
    <form class="task-form" (ngSubmit)="saveTaskChanges()">
      <label for="editTitle">Titulo</label>
      <input id="editTitle" pInputText name="editTitle" [(ngModel)]="editForm.title" required />

      <label for="editDescription">Descripcion</label>
      <textarea id="editDescription" pInputTextarea name="editDescription" [(ngModel)]="editForm.description"></textarea>

      <label for="editInputVariablesJson">Variables de entrada (JSON)</label>
      <textarea
        id="editInputVariablesJson"
        pInputTextarea
        name="editInputVariablesJson"
        [(ngModel)]="editForm.inputVariablesJson"></textarea>

      <label for="editReproSteps">Pasos para reproducir</label>
      <textarea id="editReproSteps" pInputTextarea name="editReproSteps" [(ngModel)]="editForm.reproSteps"></textarea>

      <label for="editExpectedResult">Resultado esperado</label>
      <textarea
        id="editExpectedResult"
        pInputTextarea
        name="editExpectedResult"
        [(ngModel)]="editForm.expectedResult"></textarea>

      <div class="dialog-actions">
        <button pButton type="button" label="Cancelar" severity="secondary" (click)="isEditTaskDialogVisible = false"></button>
        <button pButton type="submit" label="Guardar cambios"></button>
      </div>
    </form>
  </p-dialog>

  <p-dialog
    header="Registrar Falla"
    [(visible)]="isFailDialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '520px' }">
    <div class="task-form">
      <label for="failCause">Causa</label>
      <textarea id="failCause" pInputTextarea [(ngModel)]="failCause"></textarea>
      <div class="dialog-actions">
        <button pButton type="button" label="Cancelar" severity="secondary" (click)="isFailDialogVisible = false"></button>
        <button pButton type="button" label="Continuar" (click)="confirmFailTask()"></button>
      </div>
    </div>
  </p-dialog>

  <section class="columns">
    <div class="column">
      <h2>En espera</h2>
      @for (task of (waitingTasks$ | async); track task.id) {
        <app-task-card
          [task]="task"
          (executeRequested)="openExecuteDialog($event)"
          (editRequested)="openEditTaskDialog($event)"
          (deleteRequested)="deleteWaitingTask($event)"
          (recordOk)="registerOk($event)"
          (recordFailRequested)="openFailDialog($event)"
          (skipRequested)="skipExecutingTask($event)"
          (resetRequested)="resetTask($event)">
        </app-task-card>
      }
    </div>

    <div class="column">
      <h2>Ejecutando</h2>
      @for (task of (executingTasks$ | async); track task.id) {
        <app-task-card
          [task]="task"
          (executeRequested)="openExecuteDialog($event)"
          (editRequested)="openEditTaskDialog($event)"
          (deleteRequested)="deleteWaitingTask($event)"
          (recordOk)="registerOk($event)"
          (recordFailRequested)="openFailDialog($event)"
          (skipRequested)="skipExecutingTask($event)"
          (resetRequested)="resetTask($event)">
        </app-task-card>
      }
    </div>

    <div class="column">
      <h2>Finalizado</h2>
      @for (task of (finishedTasks$ | async); track task.id) {
        <app-task-card
          [task]="task"
          (executeRequested)="openExecuteDialog($event)"
          (editRequested)="openEditTaskDialog($event)"
          (deleteRequested)="deleteWaitingTask($event)"
          (recordOk)="registerOk($event)"
          (recordFailRequested)="openFailDialog($event)"
          (skipRequested)="skipExecutingTask($event)"
          (resetRequested)="resetTask($event)">
        </app-task-card>
      }
    </div>
  </section>
</section>
